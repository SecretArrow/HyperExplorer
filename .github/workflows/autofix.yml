name: Auto Fix

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: autofix
  cancel-in-progress: false

jobs:
  autofix:
    name: ktlint auto-format & push
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Jalankan ktlintFormat
        run: ./gradlew ktlintFormat --stacktrace

      - name: Commit & push bila ada perubahan
        run: |
          git config user.name "hyper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perbaikan otomatis yang diperlukan."
          else
            git commit -m "style: perbaikan otomatis ktlint [skip ci]"
            git push origin HEAD:main
          fi
