name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Instrumented Tests (emulator Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build APK & APK androidTest
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Jalankan test di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Image AOSP ATD (Android Test Development): boot jauh lebih cepat & stabil di CI
          # daripada google_apis penuh (mengatasi "adb device offline / boot timeout" berulang).
          api-level: 30
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # PENTING: runner mengeksekusi skrip PER BARIS — hindari blok multi-baris
          # (until/do/done). Setiap baris harus mandiri; retry instal via || { sleep; install; }.
          script: |
            adb install -g -t app/build/outputs/apk/debug/app-debug.apk || { sleep 20; adb install -g -t app/build/outputs/apk/debug/app-debug.apk; } || { sleep 20; adb install -g -t app/build/outputs/apk/debug/app-debug.apk; }
            adb shell appops set com.hyperexplorer.app MANAGE_EXTERNAL_STORAGE allow
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload laporan e2e (saat gagal)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7
