name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Instrumented Tests (emulator Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK & APK androidTest
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Jalankan test di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            set -e
            attempt=1
            max=3
            until adb install -g -t app/build/outputs/apk/debug/app-debug.apk; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::adb install gagal setelah $max percobaan"
                exit 1
              fi
              echo "Percobaan instal #$attempt gagal (umumnya INSTALL_FAILED_VERIFICATION_FAILURE sementara di emulator) - mencoba lagi dalam 20 detik..."
              attempt=$((attempt+1))
              sleep 20
            done
            adb shell appops set com.hyperexplorer.app MANAGE_EXTERNAL_STORAGE allow
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload laporan e2e (saat gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7
