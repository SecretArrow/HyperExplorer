# JVM args: heap cukup untuk build Android di CI, GC paralel cepat & hemat memori
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# Build paralel antar modul (hemat waktu)
org.gradle.parallel=true
# Build cache (hemat waktu build ulang)
org.gradle.caching=true
# AndroidX wajib
android.useAndroidX=true
# R class non-transitif = build lebih cepat
android.nonTransitiveRClass=true
# Gaya kode Kotlin resmi
kotlin.code.style=official

# AGP 9: built-in Kotlin default AKTIF, tetapi versi Kotlin-nya terikat AGP
# (9.3.x = 2.2.x). Proyek memakai Kotlin 2.4.20 eksternal -> opt-out resmi
# (SEMENTARA, dihapus di AGP 10; migrasi built-in Kotlin = tugas terpisah).
android.builtInKotlin=false
android.newDsl=false
