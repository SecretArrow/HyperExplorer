# JVM args: heap cukup untuk build Android di CI, GC paralel cepat & hemat memori
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# Build paralel antar modul (hemat waktu)
org.gradle.parallel=true
# Build cache (hemat waktu build ulang)
org.gradle.caching=true
# AndroidX wajib
android.useAndroidX=true
# R class non-transitif = build lebih cepat
android.nonTransitiveRClass=true
# Gaya kode Kotlin resmi
kotlin.code.style=official
